<!DOCTYPE html>
<html>
<head>
    <title>Personalidad - Model prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        input[type="submit"] {
            background-color: #333;
            color: #fff;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #555;
        }
        h3 {
            margin-top: 20px;
            background-color: #fff;
            padding: 10px;
            border-radius: 4px;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <h2>Introduce the values</h2>
    
    <form action="/" method="post">
        <label for="val1">Tiempo en soledad:</label>
        <input type="number" step="any" name="val1" required><br>
        
        <label for="val2">Miedo a la exposición:</label>
        <input type="number" step="any" name="val2" required><br>
        
        <label for="val3">Asistencia a eventos:</label>
        <input type="number" step="any" name="val3" required><br>
        
        <label for="val4">Exposición:</label>
        <input type="number" step="any" name="val4" required><br>
        
        <label for="val5">Agotamiento luego de socializar:</label>
        <input type="number" step="any" name="val5" required><br>
        
        <label for="val6">Círculo Social:</label>
        <input type="number" step="any" name="val6" required><br>
        
        <label for="val7">Frecuencia de exposición:</label>
        <input type="number" step="any" name="val7" required><br>
        
        <input type="submit" value="Predict">
    </form>
    
    {% if prediction != None %}
        <h3>Prediction: {{ prediction }}</h3>
    {% endif %}
</body>
</html>
